events {
    worker_connections 1024;
}

http {
    upstream tafseer_upstream {
        server tafseer-radio:8000;
    }

    upstream tilawat_upstream {
        server tilawat-radio:8000;
    }

    upstream translation_upstream {
        server translation-radio:8000;
    }

    map $request_method $cors_preflight {
        default 0;
        OPTIONS 1;
    }

    server {
        listen 80;
        server_name livequran.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name livequran.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/livequran.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/livequran.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, X-Requested-With, Content-Type, Range" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS, HEAD" always;

        if ($cors_preflight) {
            return 204;
        }

        location = / {
            return 200 "Live Quran proxy is running\n";
            add_header Content-Type text/plain;
        }

        location /tafseer {
            proxy_pass http://tafseer_upstream/tafseer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /tilawat {
            proxy_pass http://tilawat_upstream/tilawat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /translation {
            proxy_pass http://translation_upstream/translation;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
